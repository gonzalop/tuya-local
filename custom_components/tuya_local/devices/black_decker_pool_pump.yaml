          min: 0
          max: 24

  - entity: time
    name: Mode 2 start time
    category: config
    icon: "mdi:clock-start"
    dps:
      - id: 143
        type: integer
        name: hour
        range:
          min: 0
          max: 23
      - id: 144
        type: integer
        name: minute
        range:
          min: 0
          max: 50
        mapping:
          - step: 10

  - entity: number
    name: Mode 3 speed
    category: config
    icon: "mdi:numeric-3-circle-outline"
    dps:
      - id: 155
        type: integer
        name: value
        unit: rpm
        range:
          min: 1000
          max: 3450
        mapping:
          - step: 10

  - entity: number
